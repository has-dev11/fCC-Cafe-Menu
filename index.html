<html>
  <head>
    <base href="" />
    <style class="fcc-hide-header">
      head *,
      title,
      meta,
      link,
      script {
        display: none !important;
      }
    </style>
    <script>
      window.__frameId = "fcc-project-preview-frame";
      function __fccAlertParent(variant, externalLink) {
        window.parent.postMessage(
          {
            type: "fcc:preview:alert",
            variant: variant,
            externalLink: externalLink,
          },
          "https://www.freecodecamp.org",
        );
      }
      window.onerror = function (msg) {
        const string = msg.toLowerCase();
        if (string.includes("script error")) {
          msg = "Build error, open your browser console to learn more.";
        }
        console.log(msg);
        return true;
      };
      document.addEventListener(
        "click",
        function (e) {
          let element = e.target;
          while (element && element.nodeName !== "A") {
            element = element.parentElement;
          }
          if (
            element &&
            element.nodeName === "A" &&
            new URL(element.href).hash === ""
          ) {
            e.preventDefault();
            __fccAlertParent("external-link", element.href);
          }
          if (element) {
            const href = element.getAttribute("href");
            if (!href || (href[0] !== "#" && !href.match(/^https?:\/\//))) {
              e.preventDefault();
            } else if (href.match(/^#.+/)) {
              e.preventDefault();
              const scrollId = href.substring(1);
              window.location.hash = scrollId;
            }
          }
        },
        false,
      );
      document.addEventListener(
        "submit",
        function (e) {
          const action = e.target.getAttribute("action");
          e.preventDefault();
          if (action && action.match(/https?:\/\//)) {
            __fccAlertParent("external-form", action);
          }
        },
        false,
      );
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe Menu</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="menu">
      <main>
        <h1>CAMPER CAFE</h1>
        <p class="established">Est. 2020</p>
        <hr />
        <section>
          <h2>Coffee</h2>
          <img
            src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg"
            alt="coffee icon"
          />
          <article class="item">
            <p class="flavor">French Vanilla</p>
            <p class="price">3.00</p>
          </article>
          <article class="item">
            <p class="flavor">Caramel Macchiato</p>
            <p class="price">3.75</p>
          </article>
          <article class="item">
            <p class="flavor">Pumpkin Spice</p>
            <p class="price">3.50</p>
          </article>
          <article class="item">
            <p class="flavor">Hazelnut</p>
            <p class="price">4.00</p>
          </article>
          <article class="item">
            <p class="flavor">Mocha</p>
            <p class="price">4.50</p>
          </article>
        </section>
        <section>
          <h2>Desserts</h2>
          <img
            src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg"
            alt="pie icon"
          />
          <article class="item">
            <p class="dessert">Donut</p>
            <p class="price">1.50</p>
          </article>
          <article class="item">
            <p class="dessert">Cherry Pie</p>
            <p class="price">2.75</p>
          </article>
          <article class="item">
            <p class="dessert">Cheesecake</p>
            <p class="price">3.00</p>
          </article>
          <article class="item">
            <p class="dessert">Cinnamon Roll</p>
            <p class="price">2.50</p>
          </article>
        </section>
      </main>
      <hr class="bottom-line" />
      <footer>
        <address>
          <p>
            <a href="https://www.freecodecamp.org" target="_blank"
              >Visit our website</a
            >
          </p>
          <p class="address">123 Free Code Camp Drive</p>
        </address>
      </footer>
    </div>
  </body>
</html>
